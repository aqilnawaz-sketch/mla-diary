<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0c0e"><meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="MLA Diary">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/favicon-32.png">
<title>MLA Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: the firm's own desk tool — brisk, exact
   IDEA: the court diary / cause list, in the website's black-and-gold chambers identity
   PICTURE: the live diary, opening on today's hearings
   COLOUR and TYPE: website palette (#0c0c0e ground, #c9a444 gold, cream text); Cinzel headings, Plex Sans for figures and forms
   LAYOUT: logo header with tabs, one working column up to 1100px, dialogs for forms */
:root{color-scheme:dark;--bg:#0c0c0e;--bg2:#111116;--card:#161620;--ink:#e8dfc8;--mute:#a39a8a;--line:#2b2a33;--gold:#c9a444;--gold2:#e4c46e;--gold3:#f5dfa0;--tape:#ef6b62;--tape2:#3a1a19;--ok:#86d39a;--okbg:#15271b;--gown:#111116}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
html[lang=ur] body{font-family:"Noto Nastaliq Urdu","IBM Plex Sans",serif;line-height:2}
html[lang=ur] h1,html[lang=ur] h2,html[lang=ur] h3,html[lang=ur] h4,html[lang=ur] button,html[lang=ur] .btn,html[lang=ur] nav button{font-family:"Noto Nastaliq Urdu","IBM Plex Sans",serif;line-height:1.9}
h1,h2,h3,h4{font-family:Cinzel,Georgia,serif;letter-spacing:.01em;margin:0;line-height:1.15;text-wrap:balance}
header{background:var(--bg2);color:var(--ink);padding:14px max(4vw,16px) 0;border-bottom:1px solid #3a321c}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;border-radius:50%;flex:none}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1100px;margin:auto}
h1{font-size:clamp(22px,3.6vw,32px);font-weight:700;color:var(--gold2)}h1 span{color:var(--ink);font-weight:500}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.hb{display:flex;gap:8px;flex-wrap:wrap}
.hb .ghost{color:var(--gold2);border-color:#3a321c}
nav{display:flex;gap:2px;max-width:1100px;margin:14px auto 0;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:var(--mute);font:600 15px "IBM Plex Sans",system-ui,sans-serif;padding:10px 14px;min-height:44px;border-radius:8px 8px 0 0;cursor:pointer;flex:none}
nav button.on{background:var(--bg);color:var(--gold2);box-shadow:inset 0 2px 0 var(--gold)}
main{max-width:1100px;margin:auto;padding:20px max(4vw,16px) 60px}
button,.btn{font:600 15px "IBM Plex Sans",system-ui,sans-serif;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold);color:#16120a}
.sm{min-height:36px;padding:0 11px;font-size:14px}
.ghost{background:transparent}
.danger{color:var(--tape)}
input,select,textarea{font:16px "IBM Plex Sans",sans-serif;width:100%;padding:9px 11px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
label{display:block;font-size:14px;font-weight:600;color:var(--mute)}
label input,label select,label textarea{margin-top:3px;color:var(--ink);font-weight:400}
.chk{display:flex;align-items:center;gap:8px}.chk input{width:22px;min-height:22px;margin:0}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chip b{display:block;color:var(--gold2);font:700 clamp(21px,3.4vw,30px)/1.15 Cinzel,serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{color:var(--mute);font-size:14px}
.chip.alert{border-color:var(--tape);background:var(--tape2)}.chip.alert b{color:var(--tape)}
.day{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid #3a321c}
.dt b{display:block;font:700 28px/1.05 Cinzel,serif;color:var(--gold2)}.dt span{font-size:14px;color:var(--mute)}
.dt.past b{color:var(--tape)}
.rows{display:grid;gap:10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.row .main{flex:1 1 260px;cursor:pointer}
.row h3{font-size:18px}
.meta{font-size:14px;color:var(--mute)}
.tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.due{background:var(--tape2);color:var(--tape)}.tag.paid{background:var(--okbg);color:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.bar input[type=search]{flex:1 1 220px;width:auto}.bar select,.bar input[type=date]{flex:0 1 170px;width:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.panel h3{font-size:17px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
tbody tr[data-a]{cursor:pointer}tbody tr[data-a]:hover{background:var(--bg)}
.empty{padding:36px 16px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.note{padding:10px 14px;border-radius:8px;background:var(--tape2);margin-bottom:16px;font-size:15px}
h2.sec{font-size:22px;margin:22px 0 12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:18px}
.cal .wd{font-size:13px;color:var(--mute);text-align:center;padding:4px 0}
.cal button{min-height:58px;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:6px;font-weight:600;gap:2px}
.cal button.out{opacity:.35}.cal button.td{border-color:var(--gold);border-width:2px}.cal button.sel{background:var(--gold);color:#16120a}
.cal button i{font-style:normal;font-size:12px;background:var(--gold2);color:#16120a;border-radius:99px;padding:0 6px;align-self:center}
.cal button u{text-decoration:none;font-size:11px;color:var(--tape)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calh h2{font-size:24px}
.bars{display:grid;gap:8px}
.br{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.br .tr{background:var(--line);border-radius:4px;height:14px;overflow:hidden}.br .tr div{background:linear-gradient(90deg,var(--gold),var(--gold2));height:100%}
.br span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br b{font-variant-numeric:tabular-nums;white-space:nowrap}
dialog{border:0;border-radius:14px;padding:0;width:min(680px,95vw);max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0009}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.db{padding:16px 18px;display:grid;gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.hist{display:grid;gap:6px;font-size:15px}
.hist>div{border-inline-start:3px solid var(--line);padding:4px 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.hist>div.p{border-color:var(--ok)}.hist>div.x{border-color:var(--tape)}
.hist .sp{flex:1 1 auto}
.db h4{margin-top:6px;font-size:16px;font-weight:800}
.sum{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}.sum b{font-variant-numeric:tabular-nums}
.dlrow{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:8px;align-items:end}
.lock{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#1c1a14,var(--bg) 70%);color:var(--ink);display:grid;place-items:center;padding:20px;z-index:5;overflow:auto}
.lock[hidden],#appWrap[hidden]{display:none}
.lockbox{width:min(400px,100%);display:grid;gap:14px}
.lockbox label{color:var(--mute)}.lockbox input{background:var(--card);color:var(--ink);border-color:#3a321c}
.lockbox>div:first-child{text-align:center}.lockbox .seal{width:132px;height:132px;border-radius:50%;margin:0 auto 10px;display:block;box-shadow:0 0 0 1px #3a321c,0 10px 40px #0008}
.lockbox .meta{color:var(--mute)}.err{color:var(--tape);font-weight:600;min-height:1.2em}
.lockbox .ghost{color:var(--gold2);border-color:#3a321c}.lockbox .acts{justify-content:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gold);color:#16120a;font-weight:600;padding:12px 18px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){.day{grid-template-columns:1fr;gap:8px}.dt b{display:inline;font-size:24px;margin-inline-end:8px}.cal button{min-height:48px;padding:4px 2px}.dlrow{grid-template-columns:1fr 1fr}.dlrow button{grid-column:1/-1}
table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 12px;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-7.5em;white-space:normal;color:var(--mute);font-size:13px}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div id="lock" class="lock" hidden><div class="lockbox">
  <div><img class="seal" src="icons/mian-law-associates-logo-256.webp" alt="Mian Law Associates"><h1>MLA <span>Diary</span></h1><p class="sub" id="lkSub"></p></div>
  <form id="lockForm" class="lockbox" autocomplete="on">
    <input type="text" name="username" value="MLA Diary" autocomplete="username" hidden>
    <label><span id="lkL1"></span><input type="password" name="p1" required></label>
    <label id="lkC"><span data-t="confirmPass"></span><input type="password" name="p2" autocomplete="new-password"></label>
    <p class="meta" id="lkWarn"></p><div class="err" id="lkErr" role="alert"></div>
    <button class="pri" type="submit" id="lkBtn"></button>
  </form>
  <div class="acts"><button type="button" class="ghost sm" data-a="restoreStart" data-t="restore"></button><button type="button" class="ghost sm" data-a="eraseStart" id="lkErase" data-t="forgot"></button><button type="button" class="ghost sm" data-a="langLock" data-t="langBtn"></button></div>
</div></div>
<div id="appWrap" hidden>
<header>
  <div class="top">
    <div class="brand"><img src="icons/mian-law-associates-logo-128.webp" alt="Mian Law Associates"><div><h1>MLA <span>Diary</span></h1><div class="sub" data-t="appSub"></div></div></div>
    <div class="hb"><button type="button" class="ghost" data-a="lockNow" data-t="lockBtn"></button><button type="button" class="ghost" data-a="lang" data-t="langBtn"></button><button class="pri" type="button" data-a="newCase" data-t="newCase"></button></div>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <div id="status" class="note" style="display:none"></div>
  <div id="view"></div>
</main>
</div>

<dialog id="caseDlg"><form id="caseForm" novalidate>
  <div class="dh"><h3 id="cfTitle"></h3><button type="button" class="sm ghost" data-a="close" data-t="close"></button></div>
  <div class="db">
    <div class="g2">
      <label><span data-t="client"></span><input name="client" list="clientList" autocomplete="off"></label>
      <label><span data-t="phone"></span><input name="phone" inputmode="tel" placeholder="03xx-xxxxxxx"></label>
    </div>
    <label><span data-t="title"></span><input name="title" placeholder="e.g. Ahmad vs State"></label>
    <div class="g2">
      <label><span data-t="opp"></span><input name="opp"></label>
      <label><span data-t="caseNo"></span><input name="caseNo"></label>
      <label><span data-t="fir"></span><input name="fir"></label>
      <label><span data-t="ps"></span><input name="ps"></label>
      <label><span data-t="sections"></span><input name="sections"></label>
      <label><span data-t="court"></span><input name="court" list="courts"></label>
      <label><span data-t="judge"></span><input name="judge"></label>
      <label><span data-t="type"></span><select name="type"></select></label>
      <label><span data-t="status"></span><select name="status"></select></label>
      <label><span data-t="filed"></span><input type="date" name="filed"></label>
      <label><span data-t="nextDate"></span><input type="date" name="nextDate"></label>
      <label><span data-t="stage"></span><input name="stage" placeholder="Evidence, Arguments…"></label>
      <label class="adm"><span data-t="lockFee"></span><input name="fee" type="number" min="0" step="500" inputmode="numeric"></label>
    </div>
    <div><h4 data-t="deadlines"></h4><div id="dlRows" class="hist"></div><button type="button" class="sm ghost" data-a="addDl" data-t="addDeadline"></button></div>
    <label><span data-t="notes"></span><textarea name="notes" rows="2"></textarea></label>
    <div class="acts"><button class="pri" type="submit" data-t="save"></button><button type="button" class="ghost" data-a="close" data-t="cancel"></button></div>
  </div>
</form></dialog>

<dialog id="clientDlg"><form id="clientForm" novalidate>
  <div class="dh"><h3 id="clTitle"></h3><button type="button" class="sm ghost" data-a="close" data-t="close"></button></div>
  <div class="db">
    <div class="g2">
      <label><span data-t="client"></span><input name="name"></label>
      <label><span data-t="phone"></span><input name="phone" inputmode="tel"></label>
      <label><span data-t="cnic"></span><input name="cnic" inputmode="numeric" placeholder="xxxxx-xxxxxxx-x"></label>
      <label><span data-t="referred"></span><input name="ref"></label>
    </div>
    <label><span data-t="address"></span><input name="address"></label>
    <label><span data-t="notes"></span><textarea name="notes" rows="2"></textarea></label>
    <div class="acts"><button class="pri" type="submit" data-t="save"></button><button type="button" class="ghost" data-a="close" data-t="cancel"></button><button type="button" class="ghost danger" data-a="delClient" id="delClientBtn" data-t="del"></button></div>
    <div id="clCases"></div>
  </div>
</form></dialog>

<dialog id="detDlg"><div class="dh"><h3 id="dTitle"></h3><button type="button" class="sm ghost" data-a="close" data-t="close"></button></div><div class="db" id="dBody"></div></dialog>

<dialog id="hearDlg"><form id="hearForm">
  <div class="dh"><h3 data-t="update"></h3><button type="button" class="sm ghost" data-a="close" data-t="close"></button></div>
  <div class="db">
    <div class="meta" id="hCase"></div>
    <label><span data-t="hearDate"></span><input type="date" name="d"></label>
    <label><span data-t="happened"></span><textarea name="note" rows="2"></textarea></label>
    <div class="g2"><label><span data-t="nextDate"></span><input type="date" name="next"></label><label><span data-t="nextStage"></span><input name="stage"></label></div>
    <label><span data-t="status"></span><select name="status"></select></label>
    <div class="acts"><button class="pri" type="submit" data-t="save"></button><button type="button" class="ghost" data-a="close" data-t="cancel"></button></div>
  </div>
</form></dialog>

<dialog id="moneyDlg"><form id="moneyForm">
  <div class="dh"><h3 id="mTitle"></h3><button type="button" class="sm ghost" data-a="close" data-t="close"></button></div>
  <div class="db">
    <div class="meta" id="mCase"></div>
    <div class="g2"><label><span data-t="amount"></span><input type="number" name="amt" min="0" inputmode="numeric"></label><label><span data-t="date"></span><input type="date" name="d"></label></div>
    <label id="mModeL"><span data-t="mode"></span><select name="mode"><option>Cash</option><option>Bank transfer</option><option>JazzCash</option><option>Easypaisa</option><option>Cheque</option></select></label>
    <label id="mBillL" class="chk"><input type="checkbox" name="bill" checked><span data-t="billable"></span></label>
    <label><span data-t="note"></span><input name="note"></label>
    <div class="acts"><button class="pri" type="submit" data-t="save"></button><button type="button" class="ghost" data-a="close" data-t="cancel"></button></div>
  </div>
</form></dialog>

<dialog id="restoreDlg"><form id="restoreForm">
  <div class="dh"><h3 data-t="restore"></h3><button type="button" class="sm ghost" data-a="close" data-t="close"></button></div>
  <div class="db"><p class="note" id="rsWarn"></p>
    <label><span data-t="backupFile"></span><input type="file" id="restoreFile" accept=".json,application/json"></label>
    <label><span data-t="backupPass"></span><input type="password" name="rp" autocomplete="off"></label>
    <div class="err" id="rsErr" role="alert"></div>
    <div class="acts"><button class="pri" type="submit" id="rsBtn" data-t="restore"></button><button type="button" class="ghost" data-a="close" data-t="cancel"></button></div></div>
</form></dialog>
<dialog id="eraseDlg"><form id="eraseForm">
  <div class="dh"><h3 data-t="erase"></h3><button type="button" class="sm ghost" data-a="close" data-t="close"></button></div>
  <div class="db"><p data-t="eraseHelp"></p><label><span data-t="typeErase"></span><input name="w" autocomplete="off"></label>
    <div class="acts"><button class="pri" type="submit" data-t="erase"></button><button type="button" class="ghost" data-a="close" data-t="cancel"></button></div></div>
</form></dialog>
<input type="file" id="fileIn" accept="image/*,application/pdf" hidden>
<datalist id="courts"></datalist><datalist id="clientList"></datalist>
<div class="toast" id="toast" role="status"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
